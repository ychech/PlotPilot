version: 5.10.9-structured-worldbuilding-and-prompt-keys
name: PlotPilot 内置
description: CPMS v5 统一提示词库 — 全节点中文提示词、统一注册表、消除硬编码
author: PlotPilot Team
engine: jinja2
changelog: 'v5.10.9: 新增 novel-title-generate 与 chapter-tail-closure-repair 节点；PromptRegistry.render_to_prompt 写入 node_key/source，修复完整提示词日志 unknown；bible-worldbuilding-field 改为 summary+quick_ref 严格 JSON 输出，后端规范化保存并在下游提示词中提炼注入；bible-chain-context 省略空上游块；正文主提示补充场景切换桥接约束。v5.10.8: 新增通用类型边界契约，世界观字段、文风公约和正文主提示均要求主类型优先，禁止未明示的相邻热门题材反客为主；混搭必须服从主类型舞台与读者预期。v5.10.7: 正文主提示词 chapter-generation-main 新增 novel_tags 分段，后端从建书前端的类型/世界观前缀提取短标签并在单章、流式、自动托管和降级路径统一激活；文风锁去重，避免标签重复注入。v5.10.6: 幕级章节规划 context 增加变量说明、来源说明和长度约束，后端压缩故事内核/世界观/人物/地点后再注入；自动托管 start 原子落库 auto_approve_mode，避免并行 PATCH 导致停在审阅点。v5.10.5: 精简 Bible 链路上下文，角色/地点生成只注入压缩后的故事内核、世界观摘要、人物摘要和文风摘要；世界观字段改为按字段类型动态字数规则，max_tokens 仅作宽裕兜底。v5.10.4: 正文生成新增本书题材与文风锁，前置压入建档故事内核、Bible 文风公约、声纹摘要和题材规则；修正系统体量前缀后题材/世界观抽取不稳。v5.10.3: 将 length_rule 从编号项改为独立篇幅控制块，降低模板感；v5.10.2: 精简 chapter-generation-main，移除未注入占位符，显式对齐 outline/beat_section 与文风变量；v5.10.1: 修正去 AI 腔规则措辞，避免模型误读短句/破折号约束；v5.10: 强化前三章开篇质量、类型承诺兑现与对白厚度约束；v5.9: 新增章节生成 fragment 节点与 planning-macro-volume / planning-next-act-dual-track / chapter-outline-suggest，进一步移除 workflow/规划服务中的混杂提示词；v5.8: 移除 Bible/Knowledge 生成链路中的 Python 硬编码 LLM 提示词，新增 bible-chain-context、novel-profile-lock、llm-json-retry-reminder 节点；v5.7: Bible 生成改为故事创意->世界观->人物->地点的链式上下文，并为相关节点补充 chain_context；v5.6: 强化正文生成默认第三人称限制视角与章节任务闭环，避免第一人称误用和半章式断尾；v5.5: 抽离 planning-macro-precise / planning-macro-repair，并升级 planning-act 为真实幕级章节规划契约；v5.4: 将 planning-quick-macro 宏观规划主提示词从服务硬编码抽离到 node；v5.3: 强化 knowledge-initial 提示词严格性，禁止推测/多余字段；v5.2: 更新 bible-style-convention 至详细中文版本'
