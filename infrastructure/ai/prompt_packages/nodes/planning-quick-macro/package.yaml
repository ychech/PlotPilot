name: 极速宏观规划·破城槌
category: planning
source: infrastructure/ai/prompts/prompts_defaults.json
description: 极速模式：狂热主编风格，基于英雄之旅与救猫咪理论强推商业网文骨架
builtin: true
tags:
- 宏观规划
- 破城槌
- 商业节奏
variables:
- name: target_chapters
  desc: 目标章节数
  type: number
- name: worldview_context
  desc: 世界观、人物、关系、地点、时间线的合并上下文；由 ContinuousPlanningService._format_macro_worldview_context 根据 Bible 生成。
  type: string
- name: depth_instruction
  desc: 根据目标篇幅生成的规划深度指令；决定只规划部卷框架、部分幕，还是完整部/卷/幕。
  type: string
  default: ''
- name: total_recommended_acts
  desc: 结构计算引擎推荐总幕数。
  type: number
- name: recommended_parts
  desc: 结构计算引擎推荐部数。
  type: number
- name: recommended_volumes_per_part
  desc: 结构计算引擎推荐每部卷数。
  type: number
- name: recommended_acts_per_volume
  desc: 结构计算引擎推荐每卷幕数。
  type: number
- name: recommended_chapters_per_act
  desc: 结构计算引擎推荐每幕章数。
  type: number
- name: acts_output_instruction
  desc: 按 planning_depth 生成的 acts 输出说明；超长篇可只输出部/卷，短中篇输出幕。
  type: string
  default: ''
id: planning-quick-macro
sort_order: 19
