name: 幕级章节规划
category: planning
source: application/blueprint/services/continuous_planning_service.py::_build_act_planning_prompt()
description: 将抽象的幕（Act）大纲落地为充满递进张力的章纲序列
builtin: true
tags:
- 规划
- 幕级
- JSON输出
output_format: json
variables:
- name: context
  desc: 压缩后的幕级规划输入，包含本幕目标、前情、故事内核锁摘要、世界观摘要、最多6个人物和6个地点；通常控制在2000字以内，不包含正文原文。
  type: string
  required: true
- name: chapter_count
  desc: 本幕需要输出的章节数量，必须严格输出对应数量的 chapters 项
  type: integer
  required: true
id: planning-act
sort_order: 20
