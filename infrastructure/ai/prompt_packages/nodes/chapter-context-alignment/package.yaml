name: 章节上下文对齐协议
category: generation
source: application/workflows/auto_novel_generation_workflow.py::_build_context_alignment_protocol()
description: 章节正文生成时的上下文优先级与一致性对齐协议。用于约束模型承接近期章节、Bible、FACT_LOCK 和故事线，避免重置关系、重复揭露或使用旧占位名。
builtin: true
tags:
- 核心
- 上下文
- 一致性
- 章节生成
output_format: text
variables:
- name: context
  desc: 章节主上下文聚合块；由 ContextBuilder.build_structured_context 生成，通常包含 Layer1、RECENT CHAPTERS、VECTOR RECALL。
  type: string
  required: true
  source: AutoNovelGenerationWorkflow.prepare_chapter_generation
  builder: ContextBuilder.build_structured_context
  prompt_role: background_constraints
  token_budget: 35000
  empty_behavior: 生成不应依赖空 context；若为空，优先检查上下文构建器和数据源。
  editor_note: 模板中要求模型内化并对齐 context，正文自然承接即可。
- name: outline
  desc: 本章大纲；用户或托管大纲生成器提供。若与 Bible/FACT_LOCK 冲突，正文只保留其核心事件意图。
  type: string
  required: true
  source: API request or HostedWriteService.suggest_outline
  prompt_role: chapter_intent
- name: priority_order
  desc: 冲突解决优先级；代码 fallback 固定为 FACT_LOCK > Bible 正典 > 故事线/里程碑 > 最近章节正文 > 向量召回 > 本章大纲措辞。
  type: string
  required: false
  default: FACT_LOCK > Bible 正典 > 故事线/里程碑 > 最近章节正文 > 向量召回 > 本章大纲措辞
  prompt_role: hard_guardrail
id: chapter-context-alignment
sort_order: 1
