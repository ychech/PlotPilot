name: 主工作流章节生成 v8（章节闭环与人称锁）
category: generation
source: application/workflows/auto_novel_generation_workflow.py::_build_prompt()
description: 'v8: 在v7 Anti-AI 协议基础上，强化默认第三人称限制视角与章节任务闭环。正文必须完成本章阶段性结果，不能停在任何新物件、新声音、新人物、新信息、新威胁、新提示或新异象刚出现的位置。'
builtin: true
tags:
- 核心
- v8
- Anti-AI协议
- 高字数
- 去套路
- 记忆引擎
- 行为协议
- 章节闭环
- 第三人称限制视角
variables:
- name: context
  desc: 章节主上下文聚合块。由 ContextBuilder.build_structured_context 生成，并由 assemble_chapter_bundle_context_text 拼成 Layer1 + RECENT CHAPTERS + VECTOR RECALL。它是模型写正文时的主要事实来源，不是给模型复述的材料。
  type: context_bundle
  required: true
  source: AutoNovelGenerationWorkflow.prepare_chapter_generation
  builder: ContextBuilder.build_structured_context
  contains:
  - layer1_text: Bible、主线锚点、角色状态、叙事债务、FACT_LOCK 等高优先级约束
  - layer2_text: RECENT CHAPTERS，近期章节正文/摘要，用于承接状态和连续性
  - layer3_text: VECTOR RECALL，向量召回的远期相关历史，用于避免遗忘
  token_budget: 35000
  priority: high
  prompt_role: background_constraints
  empty_behavior: 不建议为空；为空时生成质量会明显下降，应检查上下文构建和数据库内容。
  editor_note: 模板中应要求模型内化并对齐 context，不要要求它解释或复述 context。
- name: character_canon_contract
  desc: Bible 角色正典锁。由生成工作流从 Bible.characters 提炼，集中约束姓名、身份、职业/能力、关系、心理状态、声线/口癖、习惯动作、核心信念、禁忌、持续伤痕，以及隐藏信息 reveal_chapter。用于防止角色混写、旧名占位、新增具名角色、提前揭露隐藏身份。
  type: string
  required: false
  default: ''
  source: AutoNovelGenerationWorkflow._build_character_canon_contract
  builder: application/workflows/auto_novel_generation_workflow.py
  contains:
  - character_names
  - role_identity
  - relationships
  - current_mental_state
  - voice_and_behavior_anchors
  - hidden_profile_reveal_limits
  priority: same_as_bible
  prompt_role: hard_character_constraints
  empty_behavior: 可为空；没有 Bible 或角色资产时跳过。
  editor_note: 这是角色一致性的硬约束变量。模板中不要把它改成“参考资料”，否则角色漂移会重新变多。
- name: outline
  desc: 本章大纲。来自用户输入、托管自动大纲或重写弹窗。若与 Bible/FACT_LOCK 冲突，正文应保留核心事件意图，但以正典设定为准。
  type: string
  required: true
  source: GenerateChapterRequest.outline or HostedWriteService.suggest_outline
  priority: medium
  prompt_role: chapter_intent
  empty_behavior: API 层拒绝空大纲。
- name: planning_section
  desc: 故事线/里程碑、情节张力、文风摘要组合块。由工作流运行时拼接，主要用于控制本章在长篇结构中的位置和节奏。
  type: string
  required: false
  default: ''
  source: _get_storyline_context + _get_plot_tension + _get_style_summary
  contains:
  - storyline_context: 当前章节命中的活跃故事线与里程碑
  - plot_tension: PlotArc 预期张力和前章实际张力反馈
  - style_summary: 声纹/文风指纹摘要
  priority: high
  prompt_role: narrative_control
  empty_behavior: 可为空；为空时只缺少宏观规划/风格辅助，不应阻塞生成。
- name: voice_block
  desc: 角色声线与肢体语言锚点。用于保持人物对白、口癖、小动作和表达习惯一致。
  type: string
  required: false
  default: ''
  source: ContextBuilder.build_voice_anchor_system_section
  priority: high
  prompt_role: character_voice
  empty_behavior: 可为空；没有角色声线资产时跳过。
- name: behavior_protocol
  desc: Anti-AI行为协议（Layer 1+2注入）
  type: string
  required: false
  default: ''
  source: CPMS node anti-ai-behavior-protocol
  priority: medium
  prompt_role: prose_quality
  empty_behavior: 可为空；代码仍会注入 prose_discipline 兜底。
- name: character_state_lock
  desc: 角色状态锁（Layer 5注入）
  type: string
  required: false
  default: ''
  source: CPMS node anti-ai-character-state-lock or DAG injection
  priority: high
  prompt_role: continuity_guardrail
  empty_behavior: 可为空；没有角色状态资产时跳过。
- name: nervous_habits
  desc: 角色紧张习惯映射
  type: string
  required: false
  default: ''
- name: allowlist_block
  desc: 场景化豁免白名单
  type: string
  required: false
  default: ''
  source: CPMS node anti-ai-allowlist-explain
  priority: low
  prompt_role: prose_quality_exception
- name: length_rule
  desc: 字数规则。由章节目标字数、节拍目标字数或默认值动态生成。它控制自然展开，不负责硬截断。
  type: string
  required: false
  default: 7. 字数是硬指标：3200-4200字（含标点）。此为下限，冲突场面须充分展开，每个重要对话至少来回三轮以上交锋。宁多勿少。
  source: _build_prompt target_words / beat_target_words
  priority: medium
  prompt_role: length_control
- name: beat_extra
  desc: 节拍模式附加说明。分节拍生成时提示当前是第几段、是否需要承接同章已生成正文。
  type: string
  required: false
  default: ''
  source: _build_prompt beat mode
  priority: medium
  prompt_role: beat_continuity
- name: beat_section
  desc: 当前节拍指令。仅节拍模式使用，包含本段目标、焦点、空间拓扑/连贯性要求等。
  type: string
  required: false
  default: ''
  source: ContextBuilder.build_beat_prompt + workflow beat extras
  priority: high
  prompt_role: local_scene_instruction
- name: fact_lock
  desc: V6 记忆引擎：FACT_LOCK + COMPLETED_BEATS + REVEALED_CLUES 组合文本块（由 MemoryEngine
    动态生成）
  type: string
  required: false
  default: ''
  source: MemoryEngine.build_fact_lock_section + get_completed_beats_section + get_revealed_clues_section
  priority: critical
  prompt_role: hard_guardrail
  empty_behavior: 可为空；MemoryEngine 未启用或无历史资产时跳过。
  editor_note: FACT_LOCK 的优先级高于大纲措辞。不要在模板中削弱它。
id: chapter-generation-main
sort_order: 0
